services:
  db:
    image: postgres:15-alpine
    container_name: express_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-express_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-express_pass}
      POSTGRES_DB: ${POSTGRES_DB:-express_stadium}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-express_user} -d ${POSTGRES_DB:-express_stadium}"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: express_backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-express_user}:${POSTGRES_PASSWORD:-express_pass}@db:5432/${POSTGRES_DB:-express_stadium}
      WIP_LIMIT: "3"
    ports:
      - "8000:8000"
    volumes:
      - ./frontend:/app/frontend:ro

volumes:
  postgres_data:
